services:
    App\Applications\Application\Port\ApplicationRepository:
        alias: App\Applications\Infrastructure\Persistence\Doctrine\DoctrineMongoApplicationRepository
        public: true

    App\Applications\Application\Port\ApplicationIdGenerator:
        class: App\Applications\Infrastructure\Identity\SymfonyUuidV7ApplicationIdGenerator
        public: true

    App\Applications\Application\Port\EventPublisher:
        class: App\Applications\Infrastructure\Messaging\SymfonyEventPublisher
        public: true
        autowire: true

    App\Applications\Application\Port\CvEnricher:
        alias: App\Applications\Infrastructure\Enrichment\DeterministicCvEnricher
        public: true

    App\Applications\Application\Command\SubmitApplicationHandler:
        public: true
        autowire: true

    App\Applications\Infrastructure\Messaging\MessengerEnrichmentDispatcher:
        public: true
        autowire: true

    App\Applications\Application\Port\ApplicationReadRepository:
        alias: App\Applications\Infrastructure\Persistence\Doctrine\DoctrineMongoApplicationReadRepository
        public: true
