health:
    path: /health
    controller: App\Infrastructure\Probe\Http\HealthController
    methods: [GET]

application_apply:
    path: /apply
    controller: App\Applications\Presentation\Http\ApplicationSubmissionController::form
    methods: [GET, POST]

application_submitted:
    path: /apply/submitted/{applicationId}
    controller: App\Applications\Presentation\Http\ApplicationSubmissionController::submitted
    methods: [GET]

application_list:
    path: /applications
    controller: App\Applications\Presentation\Http\ApplicationBrowseController::list
    methods: [GET]

application_detail:
    path: /applications/{id}
    controller: App\Applications\Presentation\Http\ApplicationBrowseController::detail
    methods: [GET]
